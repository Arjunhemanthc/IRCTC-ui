<div class="bookings-container">
  <h2>Last Transaction Detail</h2>

  <div *ngIf="isLoading" class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading bookings...</p>
  </div>

  <div *ngIf="error" class="error-state">
    <mat-icon color="warn">error</mat-icon>
    <p>{{ error }}</p>
  </div>

  <div *ngIf="!isLoading && !error && bookings.length === 0" class="empty-state">
    <mat-icon>receipt_long</mat-icon>
    <p>You have no bookings yet.</p>
  </div>

  <div class="bookings-list" *ngIf="!isLoading && !error && bookings.length > 0">
    <mat-card *ngFor="let booking of bookings" class="booking-card">
      <mat-card-header>
        <mat-card-title>PNR: {{ booking.pnr }}</mat-card-title>
        <mat-card-subtitle>Status: <span [ngClass]="'status-' + booking.status">{{ getStatusName(booking.status) }}</span></mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="booking-details">
          <p><strong>Amount:</strong> ₹{{ booking.totalAmount }}</p>
          <p><strong>Date:</strong> {{ booking.bookedAt | date:'medium' }}</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
