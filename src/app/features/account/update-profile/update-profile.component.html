<div class="update-profile-container">
  <mat-card class="profile-card">
    <mat-card-header>
      <div mat-card-avatar class="profile-avatar">
        <mat-icon>account_circle</mat-icon>
      </div>
      <mat-card-title>Update Profile</mat-card-title>
      <mat-card-subtitle>Manage your IRCTC Account details</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (authStore.error()) {
        <div class="error-banner">
          <mat-icon>error</mat-icon>
          <span>{{ authStore.error() }}</span>
        </div>
      }

      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
        
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName">
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phone">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>

        <div class="form-row triple-row">
          <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input matInput formControlName="city">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>State</mat-label>
            <input matInput formControlName="state">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Pincode</mat-label>
            <input matInput formControlName="pincode">
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="authStore.isLoading() || profileForm.invalid">
            @if (authStore.isLoading()) {
              Saving...
            } @else {
              Update Profile
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
