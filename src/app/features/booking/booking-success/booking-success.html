<div class="success-container">
  <mat-card class="success-card">
    <div class="success-header">
      <mat-icon class="success-icon">check_circle</mat-icon>
      <h2>Booking Successful</h2>
    </div>
    <mat-card-content>
      <div class="pnr-display">
        <span class="pnr-label">PNR Number</span>
        <span class="pnr-value">{{ pnr }}</span>
      </div>
      <p class="success-msg">{{ message }}</p>
      
      <div class="action-buttons">
        <button mat-raised-button color="primary" routerLink="/account/my-bookings">View Bookings</button>
        <button mat-stroked-button routerLink="/">Book Another Ticket</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
